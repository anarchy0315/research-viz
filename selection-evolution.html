        const surfaceColor = getComputedStyle(document.documentElement).getPropertyValue('--surface-color').trim() || '#FFFFFF';

        // Set Chart.js global defaults
        Chart.defaults.font.family = "'Google Sans', 'Open Sans', sans-serif";
        Chart.defaults.color = onSurface;

        if (chartInstance) {
          chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['13회(2020)', '14회(2021)', '15회(2022)', '16회(2023)', '17회(2024)', '18회(2025)'],
            datasets: [
              {
                label: '핵심 사례 (판소리·창극·연희극)',
                data: [1, 0, 1, 1, 1, 2],
                backgroundColor: colorBlue,
                borderRadius: 4,
                borderSkipped: false,
                clip: false,
                stack: 'arkostack'
              },
              {
                label: '비교 사례 (전통보컬·설화 변용)',
                data: [1, 2, 0, 2, 1, 0],
                backgroundColor: colorCyan,
                borderRadius: 4,
                borderSkipped: false,
                clip: false,
                stack: 'arkostack'
              },
              {
                label: '비해당 (순수 기악·타악·정악)',
                data: [1, 1, 1, 2, 1, 1],
                backgroundColor: colorGray,
                borderRadius: 4,
                borderSkipped: false,
                clip: false,
                stack: 'arkostack'
              }
            ]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            layout: {
              padding: { top: 4, right: 15, bottom: 0, left: 0 }
            },
            scales: {
              x: {
                stacked: true,
                grace: '5%',
                ticks: {
                  stepSize: 1,
                  font: { family: "'Google Sans', 'Open Sans', sans-serif", size: 11 },
                  color: onSurfaceVariant
                },
                grid: {
                  color: outlineVariant,
                  lineWidth: 0.75,
                  drawTicks: false
                },
                border: { display: false }
              },
              y: {
                stacked: true,
                ticks: {
                  font: { family: "'Google Sans', 'Open Sans', sans-serif", size: 12, weight: '500' },
                  color: onSurface
                },
                grid: { display: false },
                border: { display: false }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: surfaceColor,
                titleColor: onSurface,
                bodyColor: onSurfaceVariant,
                borderColor: outlineVariant,
                borderWidth: 1,
                padding: 10,
                titleFont: { family: "'Google Sans', 'Open Sans', sans-serif", size: 13, weight: 'bold' },
                bodyFont: { family: "'Google Sans', 'Open Sans', sans-serif", size: 12 },
                boxPadding: 4,
                callbacks: {
                  label: function(context) {
                    return ` ${context.dataset.label}: ${context.raw}편`;
                  }
                }
              },
              datalabels: {
                display: function(context) {
                  return context.dataset.data[context.dataIndex] > 0;
                },
                color: '#FFFFFF',
                font: { family: "'Google Sans', 'Open Sans', sans-serif", weight: 'bold', size: 11 },
                formatter: function(val) {
                  return val + '편';
                }
              }
            }
          },
          plugins: [ChartDataLabels]
        });
      }

      // Theme Listener
      window.addEventListener("message", (event) => {
        if (event.data && (event.data.theme === "light" || event.data.theme === "dark")) {
          document.documentElement.setAttribute("data-theme", event.data.theme);
          setTimeout(() => {
            renderChart();
          }, 50);
        }
      });

      // Race Condition Fix: Wait for fonts ready before drawing Chart.js canvas
      document.fonts.ready.then(() => {
        renderChart();
      });
    </script>
  
</body></html>
